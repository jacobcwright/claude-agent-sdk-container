# Porter Configuration for Claude Agent SDK Container
# See: https://docs.porter.run/deploy/configuration-as-code

version: v2
name: claude-sdk-container

build:
  method: docker
  context: ./
  dockerfile: ./Dockerfile

services:
  - name: web
    type: web
    run: ./docker-entrypoint.sh
    port: 8080
    healthCheck:
      enabled: true
      httpPath: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    env:
      PORT: '8080'
      # Required: Anthropic API Key
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY}'
      # Optional: API Key for REST endpoint protection
      CLAUDE_AGENT_SDK_CONTAINER_API_KEY: '${CLAUDE_AGENT_SDK_CONTAINER_API_KEY}'
      # Required: GitHub OAuth Configuration
      GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID}'
      GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET}'
      # Required: GitHub Access Control (at least one must be set)
      ALLOWED_GITHUB_USERS: '${ALLOWED_GITHUB_USERS}'
      # Optional: GitHub Organization (alternative to ALLOWED_GITHUB_USERS)
      ALLOWED_GITHUB_ORG: '${ALLOWED_GITHUB_ORG}'
      # Optional: JWT Session Secret (auto-generated if not provided)
      SESSION_SECRET: '${SESSION_SECRET}'
      # Required for Porter/Kubernetes: Bypass Docker check (container runs in K8s, not Docker directly)
      ALLOW_LOCAL: 'true'
